<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Select District — {{ app_title }}</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 20% 50%,
          #1a0533,
          #0d0d2b 40%,
          #001a3a
        );
        font-family: "Poppins", sans-serif;
        display: flex;
        flex-direction: column;
      }
      #stars {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.2;
        z-index: 0;
        animation: drift 12s ease-in-out infinite alternate;
      }
      .orb1 {
        width: 500px;
        height: 500px;
        background: #7b2fbe;
        top: -100px;
        left: -120px;
      }
      .orb2 {
        width: 380px;
        height: 380px;
        background: #ff6b35;
        bottom: -80px;
        right: -80px;
        animation-delay: -5s;
      }
      @keyframes drift {
        from {
          transform: translate(0, 0);
        }
        to {
          transform: translate(25px, 35px);
        }
      }

      /* Double door */
      #dS {
        position: fixed;
        top: 0;
        left: 50%;
        margin-left: -3px;
        width: 6px;
        height: 100%;
        z-index: 10001;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        background: linear-gradient(
          180deg,
          transparent,
          #ff6b35 10%,
          #ffd700 35%,
          #fff 50%,
          #ffd700 65%,
          #ff6b35 90%,
          transparent
        );
        box-shadow: 0 0 20px #ffd700, 0 0 60px rgba(255, 215, 0, 0.7);
        transition: opacity 0.2s;
      }
      #dS.v {
        opacity: 1;
        visibility: visible;
      }
      #dLt {
        position: fixed;
        inset: 0;
        z-index: 9998;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        background: radial-gradient(
          ellipse at 50% 50%,
          rgba(255, 215, 0, 0.18),
          transparent 65%
        );
        transition: opacity 0.6s 0.3s;
      }
      #dLt.v {
        opacity: 1;
        visibility: visible;
      }
      #dL {
        position: fixed;
        top: 0;
        left: 0;
        width: 50%;
        height: 100%;
        z-index: 9999;
        transform-origin: left center;
        transform: perspective(900px) rotateY(0);
        backface-visibility: hidden;
        opacity: 0;
        visibility: hidden;
        background: linear-gradient(
            to left,
            rgba(0, 0, 0, 0.5),
            rgba(0, 0, 0, 0) 30%
          ),
          radial-gradient(ellipse at 70% 50%, #1a0533, #0d0d2b 50%, #001a3a);
        border-right: 2px solid rgba(255, 215, 0, 0.7);
      }
      #dL.v {
        opacity: 1;
        visibility: visible;
      }
      #dL.o {
        transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1);
        transform: perspective(900px) rotateY(-105deg);
      }
      #dR {
        position: fixed;
        top: 0;
        right: 0;
        width: 50%;
        height: 100%;
        z-index: 9999;
        transform-origin: right center;
        transform: perspective(900px) rotateY(0);
        backface-visibility: hidden;
        opacity: 0;
        visibility: hidden;
        background: linear-gradient(
            to right,
            rgba(0, 0, 0, 0.5),
            rgba(0, 0, 0, 0) 30%
          ),
          radial-gradient(ellipse at 30% 50%, #1a0533, #0d0d2b 50%, #001a3a);
        border-left: 2px solid rgba(255, 215, 0, 0.7);
      }
      #dR.v {
        opacity: 1;
        visibility: visible;
      }
      #dR.o {
        transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1);
        transform: perspective(900px) rotateY(105deg);
      }

      /* Top bar */
      #topBar {
        position: relative;
        z-index: 10;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 24px 12px;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 215, 0, 0.12);
      }
      .back-link {
        display: flex;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, 0.5);
        text-decoration: none;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: color 0.2s;
      }
      .back-link:hover {
        color: #ffd700;
      }
      .top-title {
        text-align: center;
      }
      .top-title h2 {
        font-family: "Playfair Display", serif;
        font-size: 1.1rem;
        background: linear-gradient(90deg, #ffd700, #ff9a3c, #fff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .top-title p {
        font-size: 0.72rem;
        color: rgba(255, 255, 255, 0.35);
        margin-top: 2px;
      }
      .steps {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .step {
        width: 22px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
      }
      .step.done {
        background: rgba(255, 215, 0, 0.5);
      }
      .step.active {
        background: linear-gradient(90deg, #ff6b35, #ffd700);
      }

      /* Status bar */
      #statusBar {
        position: relative;
        z-index: 10;
        flex-shrink: 0;
        padding: 8px 24px;
        background: rgba(255, 215, 0, 0.04);
        border-bottom: 1px solid rgba(255, 215, 0, 0.08);
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 36px;
      }
      #statusDot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 215, 0, 0.3);
        flex-shrink: 0;
        transition: all 0.3s;
      }
      #statusBar.picked #statusDot {
        background: #ffd700;
        box-shadow: 0 0 10px #ffd700;
      }
      #statusTxt {
        font-size: 0.76rem;
        color: rgba(255, 215, 0, 0.6);
        letter-spacing: 0.5px;
        transition: color 0.3s;
      }
      #statusBar.picked #statusTxt {
        color: #ffd700;
      }

      /* Map container */
      #mapWrap {
        position: relative;
        flex: 1;
        overflow: hidden;
        background: #06060f;
        cursor: crosshair;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #biharSvg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* District paths */
      .dp {
        fill: #12112e;
        stroke: rgba(255, 215, 0, 0.28);
        stroke-width: 1;
        cursor: pointer;
        transition: fill 0.15s, stroke 0.15s;
      }
      .dp:hover,
      .dp.hover {
        fill: #221d52;
        stroke: #ffd700;
        stroke-width: 1.8;
        filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.35));
      }
      .dp.active {
        fill: rgba(255, 215, 0, 0.22);
        stroke: #ffd700;
        stroke-width: 2.5;
        filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6));
      }

      /* Tooltip */
      #mapTip {
        position: absolute;
        display: none;
        background: rgba(8, 8, 32, 0.96);
        border: 1px solid rgba(255, 215, 0, 0.6);
        border-radius: 9px;
        color: #ffd700;
        font-size: 0.76rem;
        font-weight: 700;
        padding: 5px 13px;
        pointer-events: none;
        z-index: 5;
        white-space: nowrap;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.65);
      }

      /* Zoom controls */
      #mapZoom {
        position: absolute;
        right: 14px;
        bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        z-index: 4;
      }
      .mzb {
        width: 30px;
        height: 30px;
        background: rgba(10, 10, 40, 0.9);
        border: 1px solid rgba(255, 215, 0, 0.25);
        border-radius: 8px;
        color: rgba(255, 215, 0, 0.8);
        font-size: 1rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        font-family: monospace;
        touch-action: manipulation;
      }
      .mzb:hover {
        background: rgba(255, 215, 0, 0.15);
        border-color: #ffd700;
        color: #ffd700;
      }
      @media (max-width: 768px) {
        .mzb {
          width: 44px;
          height: 44px;
          font-size: 1.2rem;
          border-radius: 10px;
        }
        #mapZoom {
          bottom: 24px;
          right: 12px;
          gap: 8px;
        }
        .top-title p {
          display: none;
        }
        #topBar {
          padding: 10px 16px 8px;
        }
      }

      /* Loader */
      #mapLoader {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #06060f;
        z-index: 3;
      }
      #mapLoader .spin {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid rgba(255, 215, 0, 0.15);
        border-top-color: #ffd700;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #mapLoader p {
        color: rgba(255, 215, 0, 0.5);
        font-size: 0.78rem;
        letter-spacing: 1px;
      }
      #mapLoader.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stars"></canvas>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div id="dS"></div>
    <div id="dLt"></div>
    <div id="dL"></div>
    <div id="dR"></div>
    <form id="mapForm" action="/analyse" method="POST" style="display: none">
      <input type="hidden" name="name" value="{{ name }}" />
      <input type="hidden" name="birth_year" value="{{ birth_year }}" />
      <input type="hidden" name="district" id="distHidden" />
      <input type="hidden" name="bbox" id="bboxHidden" />
    </form>
    <div id="topBar">
      <a href="/" class="back-link">&#8592; Back</a>
      <div class="top-title">
        <h2>Hello {{ name }} &#x1F44B;</h2>
        <p>Tap your district on the map</p>
      </div>
      <div class="steps">
        <div class="step done"></div>
        <div class="step active"></div>
        <div class="step"></div>
      </div>
    </div>
    <div id="statusBar">
      <div id="statusDot"></div>
      <span id="statusTxt">Loading Bihar map&hellip;</span>
    </div>
    <div id="mapWrap">
      <svg id="biharSvg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="mapTip"></div>
      <div id="mapZoom">
        <button class="mzb" id="zIn">+</button>
        <button class="mzb" id="zRst">&#8962;</button>
        <button class="mzb" id="zOut">&minus;</button>
      </div>
      <div id="mapLoader">
        <div class="spin"></div>
        <p>Loading Bihar map&hellip;</p>
      </div>
    </div>

    <script>
      /* ── Stars ── */
      (function () {
        const c = document.getElementById("stars"),
          x = c.getContext("2d");
        let s = [];
        function r() {
          c.width = innerWidth;
          c.height = innerHeight;
          s = Array.from({ length: 160 }, () => ({
            x: Math.random() * c.width,
            y: Math.random() * c.height,
            r: Math.random() * 1.4 + 0.2,
            a: Math.random(),
            da: (Math.random() - 0.5) * 0.01,
          }));
        }
        function d() {
          x.clearRect(0, 0, c.width, c.height);
          s.forEach((p) => {
            p.a = Math.max(0.05, Math.min(1, p.a + p.da));
            if (p.a <= 0.05 || p.a >= 1) p.da *= -1;
            x.beginPath();
            x.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
            x.fillStyle = `rgba(255,215,0,${p.a})`;
            x.fill();
          });
          requestAnimationFrame(d);
        }
        window.addEventListener("resize", r);
        r();
        d();
      })();

      const NS = "http://www.w3.org/2000/svg";
      let svgEl,
        vbX = 0,
        vbY = 0,
        vbW = 800,
        vbH = 500,
        activePath = null,
        mapReady = false;

      /*
       * featMap: name → GeoJSON feature
       * Used by the touch handler to look up the feature
       * from the element found via elementFromPoint().
       */
      const featMap = {};

      function setStatus(t, picked = false) {
        document.getElementById("statusTxt").innerHTML = t;
        document.getElementById("statusBar").classList.toggle("picked", picked);
      }
      function applyVB() {
        svgEl.setAttribute("viewBox", `${vbX} ${vbY} ${vbW} ${vbH}`);
      }

      function ringToD(ring, proj) {
        return (
          ring
            .map(([lng, lat], i) => {
              const [px, py] = proj(lng, lat);
              return (i ? "L" : "M") + px.toFixed(2) + " " + py.toFixed(2);
            })
            .join("") + "Z"
        );
      }
      function geomToD(g, proj) {
        if (g.type === "Polygon")
          return g.coordinates.map((r) => ringToD(r, proj)).join("");
        if (g.type === "MultiPolygon")
          return g.coordinates
            .map((p) => p.map((r) => ringToD(r, proj)).join(""))
            .join("");
        return "";
      }

      /* ── Shared district selection logic ── */
      function selectDistrict(path, feat) {
        if (activePath && activePath !== path)
          activePath.setAttribute("class", "dp");
        activePath = path;
        path.setAttribute("class", "dp active");
        path.parentNode.appendChild(path); // bring to front for z-order
        document.getElementById("mapTip").style.display = "none";

        const name = feat.properties.name;
        setStatus("✓ <strong>" + name + "</strong> selected — opening…", true);
        document.getElementById("distHidden").value = name;

        let minLng = Infinity,
          maxLng = -Infinity,
          minLat = Infinity,
          maxLat = -Infinity;
        function cc(c) {
          if (typeof c[0] === "number") {
            minLng = Math.min(minLng, c[0]);
            maxLng = Math.max(maxLng, c[0]);
            minLat = Math.min(minLat, c[1]);
            maxLat = Math.max(maxLat, c[1]);
          } else c.forEach(cc);
        }
        cc(feat.geometry.coordinates);
        document.getElementById("bboxHidden").value = JSON.stringify({
          minLng,
          minLat,
          maxLng,
          maxLat,
        });

        setTimeout(() => document.getElementById("dS").classList.add("v"), 60);
        setTimeout(() => {
          document.getElementById("dL").classList.add("v");
          document.getElementById("dR").classList.add("v");
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              document.getElementById("dL").classList.add("o");
              document.getElementById("dR").classList.add("o");
            })
          );
        }, 160);
        setTimeout(
          () => document.getElementById("dLt").classList.add("v"),
          300
        );
        setTimeout(() => document.getElementById("mapForm").submit(), 1000);
      }

      /* ── Init map ── */
      async function initMap() {
        const wrap = document.getElementById("mapWrap");
        svgEl = document.getElementById("biharSvg");
        vbW = wrap.clientWidth || 800;
        vbH = wrap.clientHeight || 500;
        svgEl.setAttribute("viewBox", `0 0 ${vbW} ${vbH}`);
        let data;
        try {
          const res = await fetch("/bihar_dist_ready.geojson");
          data = await res.json();
        } catch (e) {
          setStatus("⚠ " + e.message);
          document.getElementById("mapLoader").innerHTML =
            '<p style="color:#FF6B35">⚠ Failed to load map</p>';
          return;
        }
        if (data.error) {
          setStatus("⚠ " + data.error);
          document.getElementById("mapLoader").innerHTML =
            '<p style="color:#FF6B35">⚠ ' + data.error + "</p>";
          return;
        }

        let x0 = Infinity,
          x1 = -Infinity,
          y0 = Infinity,
          y1 = -Infinity;
        function bbox(c) {
          if (typeof c[0] === "number") {
            x0 = Math.min(x0, c[0]);
            x1 = Math.max(x1, c[0]);
            y0 = Math.min(y0, c[1]);
            y1 = Math.max(y1, c[1]);
          } else c.forEach(bbox);
        }
        data.features.forEach((f) => bbox(f.geometry.coordinates));
        const pad = 28,
          sx = (vbW - 2 * pad) / (x1 - x0),
          sy = (vbH - 2 * pad) / (y1 - y0),
          s = Math.min(sx, sy);
        const ox = (vbW - s * (x1 - x0)) / 2,
          oy = (vbH - s * (y1 - y0)) / 2;
        function proj(lng, lat) {
          return [ox + (lng - x0) * s, vbH - oy - (lat - y0) * s];
        }

        const grp = document.createElementNS(NS, "g");
        grp.id = "dg";
        const tip = document.getElementById("mapTip");

        data.features.forEach((feat) => {
          const name = feat.properties.name;
          const d = geomToD(feat.geometry, proj);
          if (!d) return;
          const path = document.createElementNS(NS, "path");
          path.setAttribute("d", d);
          path.setAttribute("class", "dp");
          path.setAttribute("data-name", name);

          /* Store feat for touch lookup — avoids needing touchend on path */
          featMap[name] = feat;

          /* ── Desktop: mouse events ── */
          path.addEventListener("mouseenter", () => {
            if (path !== activePath) path.setAttribute("class", "dp hover");
            tip.textContent = name;
            tip.style.display = "block";
            setStatus("📍 " + name, path === activePath);
          });
          path.addEventListener("mousemove", (e) => {
            const r = wrap.getBoundingClientRect();
            tip.style.left = e.clientX - r.left + 14 + "px";
            tip.style.top = e.clientY - r.top - 44 + "px";
          });
          path.addEventListener("mouseleave", () => {
            if (path !== activePath) path.setAttribute("class", "dp");
            tip.style.display = "none";
          });
          /* Desktop click — fires normally for mouse; on touch devices,
             mw.touchend calls e.preventDefault() which suppresses
             the synthetic click, so this won't double-fire.             */
          path.addEventListener("click", () => selectDistrict(path, feat));

          grp.appendChild(path);
        });
        svgEl.appendChild(grp);
        document.getElementById("mapLoader").classList.add("hidden");
        setStatus("Tap/click your district to continue");
        mapReady = true;
      }

      /* ── Zoom & pan (desktop mouse) ── */
      function doZoom(f, cx, cy) {
        cx = cx ?? vbX + vbW / 2;
        cy = cy ?? vbY + vbH / 2;
        vbX = cx - (cx - vbX) * f;
        vbY = cy - (cy - vbY) * f;
        vbW *= f;
        vbH *= f;
        applyVB();
      }
      function resetZoom() {
        const w = document.getElementById("mapWrap");
        vbX = 0;
        vbY = 0;
        vbW = w.clientWidth || 800;
        vbH = w.clientHeight || 500;
        applyVB();
      }
      document
        .getElementById("zIn")
        .addEventListener("click", () => doZoom(0.72));
      document
        .getElementById("zOut")
        .addEventListener("click", () => doZoom(1.35));
      document.getElementById("zRst").addEventListener("click", resetZoom);

      const mw = document.getElementById("mapWrap");
      mw.addEventListener(
        "wheel",
        (e) => {
          if (!mapReady) return;
          e.preventDefault();
          const r = mw.getBoundingClientRect();
          doZoom(
            e.deltaY > 0 ? 1.15 : 0.87,
            vbX + ((e.clientX - r.left) / r.width) * vbW,
            vbY + ((e.clientY - r.top) / r.height) * vbH
          );
        },
        { passive: false }
      );

      let isDrag = false,
        dSX = 0,
        dSY = 0,
        dVX = 0,
        dVY = 0;
      mw.addEventListener("mousedown", (e) => {
        if (
          e.target.classList.contains("dp") ||
          e.target.classList.contains("mzb")
        )
          return;
        isDrag = true;
        dSX = e.clientX;
        dSY = e.clientY;
        dVX = vbX;
        dVY = vbY;
        mw.style.cursor = "grabbing";
      });
      window.addEventListener("mousemove", (e) => {
        if (!isDrag) return;
        const r = mw.getBoundingClientRect();
        vbX = dVX - ((e.clientX - dSX) / r.width) * vbW;
        vbY = dVY - ((e.clientY - dSY) / r.height) * vbH;
        applyVB();
      });
      window.addEventListener("mouseup", () => {
        isDrag = false;
        mw.style.cursor = "crosshair";
      });

      /* ════════════════════════════════════════════
         TOUCH — pan, pinch-zoom, AND district select
         ALL handled on mw (parent), NOT on path elements.

         Why: iOS Safari does NOT reliably fire touchend
         on SVG <path> child elements. It ALWAYS fires
         touchend on the containing div (mw).
         We use document.elementFromPoint() to find
         which district was under the finger.
      ════════════════════════════════════════════ */
      let tpX = 0,
        tpY = 0,
        tpVX = 0,
        tpVY = 0;
      let pinchD0 = 0,
        pinchW0 = 0,
        pinchH0 = 0,
        pinchVX0 = 0,
        pinchVY0 = 0;
      let touchMoved = false; // track if finger moved significantly

      function ptDist(a, b) {
        const dx = a.clientX - b.clientX,
          dy = a.clientY - b.clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }
      function ptMid(a, b) {
        return {
          x: (a.clientX + b.clientX) / 2,
          y: (a.clientY + b.clientY) / 2,
        };
      }

      mw.addEventListener(
        "touchstart",
        (e) => {
          if (!mapReady) return;
          e.preventDefault();
          touchMoved = false;
          if (e.touches.length === 1) {
            tpX = e.touches[0].clientX;
            tpY = e.touches[0].clientY;
            tpVX = vbX;
            tpVY = vbY;
          } else if (e.touches.length === 2) {
            pinchD0 = ptDist(e.touches[0], e.touches[1]);
            pinchW0 = vbW;
            pinchH0 = vbH;
            pinchVX0 = vbX;
            pinchVY0 = vbY;
          }
        },
        { passive: false }
      );

      mw.addEventListener(
        "touchmove",
        (e) => {
          if (!mapReady) return;
          e.preventDefault();
          if (e.touches.length === 1) {
            const dx = e.touches[0].clientX - tpX,
              dy = e.touches[0].clientY - tpY;
            if (Math.sqrt(dx * dx + dy * dy) > 8) touchMoved = true; // finger moved — it's a pan
            const r = mw.getBoundingClientRect();
            vbX = tpVX - (dx / r.width) * vbW;
            vbY = tpVY - (dy / r.height) * vbH;
            applyVB();
          } else if (e.touches.length === 2) {
            touchMoved = true;
            const d = ptDist(e.touches[0], e.touches[1]);
            const scale = pinchD0 / d;
            const mid = ptMid(e.touches[0], e.touches[1]);
            const r = mw.getBoundingClientRect();
            const cx = pinchVX0 + ((mid.x - r.left) / r.width) * pinchW0;
            const cy = pinchVY0 + ((mid.y - r.top) / r.height) * pinchH0;
            vbW = pinchW0 * scale;
            vbH = pinchH0 * scale;
            vbX = cx - ((mid.x - r.left) / r.width) * vbW;
            vbY = cy - ((mid.y - r.top) / r.height) * vbH;
            applyVB();
          }
        },
        { passive: false }
      );

      mw.addEventListener(
        "touchend",
        (e) => {
          if (!mapReady) return;
          /* Only treat as a district tap if:
           1. Single finger lifted
           2. Finger did NOT move significantly (not a pan) */
          if (e.changedTouches.length !== 1 || touchMoved) return;

          const touch = e.changedTouches[0];

          /* elementFromPoint reliably identifies the SVG path
           at the tap coordinate — works even when touchend
           doesn't fire on the path element itself (iOS Safari) */
          const el = document.elementFromPoint(touch.clientX, touch.clientY);
          if (!el || !el.classList.contains("dp")) return;

          /* It's a district tap — prevent synthetic click (avoids
           double-firing the click handler on the path)          */
          e.preventDefault();

          const name = el.getAttribute("data-name");
          const feat = featMap[name];
          if (feat) selectDistrict(el, feat);
        },
        { passive: false }
      );

      initMap();
    </script>
  </body>
</html>
